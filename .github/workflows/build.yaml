name: build

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Github Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set build metadata
        id: metadata
        run: |
          echo "version=$(date -u +%Y-%m-%d) (git-${GITHUB_SHA:0:7})" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          target: server
          platforms: linux/amd64,linux/arm64
          build-args: |
            QV_VERSION=${{ steps.metadata.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/qvault:latest
